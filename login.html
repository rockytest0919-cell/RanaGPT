<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rana AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Log in – Rana Family AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
body{animation:fadeIn .5s var(--ease)}
.wrap{min-height:100%;display:grid;place-items:center;padding:max(20px,var(--sat)) max(20px,var(--sar)) max(20px,var(--sab)) max(20px,var(--sal))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:38px 34px;width:100%;max-width:400px;animation:popIn .45s var(--ease) both}
.logo{width:54px;height:54px;border-radius:16px;background:var(--accent-grad);margin:0 auto 18px;
  display:grid;place-items:center;font-size:24px;box-shadow:0 10px 34px -8px rgba(139,92,246,.6);animation:logoFloat 4s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(4deg)}}
h1{margin:0 0 4px;font-size:24px;font-family:var(--font-display);text-align:center}
p.sub{margin:0 0 26px;color:var(--muted);text-align:center}
label{display:block;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.err{background:rgba(251,91,116,.12);color:var(--danger);padding:10px 13px;border-radius:10px;margin-bottom:8px;display:none;border:1px solid rgba(251,91,116,.25)}
.btn{width:100%;margin-top:22px;padding:12px}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{width:100%;padding-right:40px}
.pw-toggle{position:absolute;right:8px;background:none;border:none;cursor:pointer;padding:4px 6px;font-size:16px;line-height:1;opacity:.65;transition:opacity .15s}
.pw-toggle:hover{opacity:1}
@media(max-width:420px){
  .card{padding:28px 20px;border-radius:18px}
  h1{font-size:22px}
  .btn{min-height:48px}
}
@media(max-height:560px){ .wrap{place-items:start center} .logo{margin-bottom:10px;width:44px;height:44px} p.sub{margin-bottom:12px} }
</style></head><body class="login-page"><div class="wrap"><form class="card" id="f">
<div class="logo">✨</div>
<h1 id="ttl">Rana Family AI</h1><p class="sub">Log in to continue</p>
<div class="err" id="err"></div>
<label for="u">Username</label><input id="u" autocomplete="username" autofocus required>
<label for="p">Password</label>
<div class="pw-wrap">
  <input id="p" type="password" autocomplete="current-password" required>
  <button type="button" class="pw-toggle" id="toggle-pw" title="Show password" aria-label="Show password">👁️</button>
</div>
<button class="btn" id="go" type="submit">Log in</button>
</form></div>
<script src="/common.js"></script>
<script>
// Al ingelogd? Dan direct door.
api("/api/auth/me","GET",undefined,{noRedirect:true}).then(j=>{
  if(j.settings?.family_name) $("ttl").textContent = j.settings.ai_name || "Rana Family AI";
  location.replace("/");
}).catch(()=>{});

$("toggle-pw").addEventListener("click", () => {
  const p = $("p");
  const isPw = p.type === "password";
  p.type = isPw ? "text" : "password";
  $("toggle-pw").textContent = isPw ? "🙈" : "👁️";
  $("toggle-pw").title = isPw ? "Password verbergen" : "Show password";
  $("toggle-pw").setAttribute("aria-label", isPw ? "Password verbergen" : "Show password");
});

$("f").addEventListener("submit", async (e)=>{
  e.preventDefault(); $("err").style.display="none"; $("go").disabled=true;
  try{
    await api("/api/auth/login","POST",{username:$("u").value.trim(),password:$("p").value},{noRedirect:true});
    location.href="/";
  }catch(x){ $("err").textContent=x.message; $("err").style.display="block"; $("go").disabled=false; $("p").focus(); $("p").select(); }
});
</script><script src="/pwa.js"></script>
</body></html>
