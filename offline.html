<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Offline – Rana Family AI</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<style>
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
       padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));text-align:center}
  .box{max-width:420px}
  .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 20px;display:block}
  h1{font-size:24px;margin:0 0 10px}
  p{color:var(--muted);line-height:1.6;margin:0 0 22px}
</style></head><body>
<div class="box">
  <img class="logo" src="/icons/icon-192.png" alt="Rana AI" width="84" height="84">
  <h1>You are offline</h1>
  <p>Rana AI needs an internet connection to answer. Check your Wi-Fi or mobile data and try again.</p>
  <button class="btn" id="retry" type="button">Try again</button>
</div>
<script>
  document.getElementById("retry").onclick=()=>location.reload();
  // Zodra de verbinding terug is, laad de app vanzelf opnieuw
  window.addEventListener("online",()=>location.replace("/"));
</script>
</body></html>
